<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>flashcards</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      font-size: 1rem;
      padding: 0.75rem;
      max-width: 50rem;
    }
    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    h1 { font-size: 1.1rem; margin: 0; flex: 1; }
    #stale:empty, #unmapped:empty { display: none; }
    #stale, #unmapped { margin: 0.5rem 0; padding: 0.5rem 0.75rem; background: #fee; color: #900; }
    button, input, select, textarea { font: inherit; }
    button { padding: 0.35rem 0.6rem; cursor: pointer; }
    ul { list-style: none; margin: 0.75rem 0 0; padding: 0; }
    #deck-list li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid #eee;
    }
    #deck-list .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: none;
      border: none;
      text-align: left;
      padding: 0;
    }
    #deck-list .by { color: #999; font-size: 0.85rem; }
    #new { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    #new input { flex: 1; padding: 0.35rem 0.5rem; }
    #deck-title { width: 100%; padding: 0.35rem 0.5rem; margin-top: 0.75rem; }
    #cards li {
      border: 1px solid #ddd;
      border-radius: 0.3rem;
      padding: 0.5rem;
      margin-top: 0.75rem;
    }
    .card-head { display: flex; justify-content: flex-end; }
    .delete {
      border: none;
      background: none;
      color: #999;
      font-size: 1rem;
      padding: 0 0.2rem;
    }
    .delete:hover { color: #c00; }
    .side { margin-top: 0.4rem; }
    .side label { display: block; color: #666; font-size: 0.85rem; }
    .side textarea { width: 100%; min-height: 3.5rem; padding: 0.35rem 0.5rem; }
    .side select { margin: 0.2rem 0; }
    #study-count { color: #666; }
    .face {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 0.3rem;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
      white-space: pre-wrap;
    }
    #study-intro { color: #666; margin: 0 0 0.5rem; }
    #grades { display: flex; gap: 0.5rem; }
    #grades button { flex: 1; }
    #study-finish { text-align: center; padding-top: 1rem; }
    #study-finish p { margin: 0.5rem 0; }
    #study-flavour { font-size: 3rem; animation: 1.2s ease-in-out infinite alternate; }
    #study-flavour:empty { display: none; }
    #study-sessions { color: #666; }
    .bounce { animation-name: bounce; }
    .spin { animation-name: spin; animation-timing-function: linear; animation-direction: normal; animation-duration: 3s; }
    .rise { animation-name: rise; }
    .wiggle { animation-name: wiggle; animation-duration: 0.4s; }
    .pulse { animation-name: pulse; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-1rem); } }
    @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    @keyframes rise { from { transform: translateY(1rem); opacity: 0.4; } to { transform: translateY(-1rem); opacity: 1; } }
    @keyframes wiggle { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
    @keyframes pulse { from { transform: scale(0.8); } to { transform: scale(1.2); } }
    .preview:empty { display: none; }
    .preview { background: #fafafa; padding: 0.4rem; white-space: pre-wrap; }
    @media (min-width: 40rem) {
      .sides { display: flex; gap: 0.75rem; }
      .side { flex: 1; min-width: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>flashcards</h1>
    <button id="back" hidden>← decks</button>
  </header>
  <p id="stale"></p>
  <p id="unmapped"></p>
  <section id="decks">
    <ul id="deck-list"></ul>
    <form id="new">
      <input id="deck-name" placeholder="New deck" required>
      <button>Add deck</button>
    </form>
  </section>
  <section id="study" hidden>
    <p id="study-count"></p>
    <p id="study-intro" hidden>A new card: read both sides aloud, then press space</p>
    <div id="study-front" class="face"></div>
    <div id="study-back" class="face" hidden></div>
    <button id="reveal">Show answer</button>
    <div id="grades" hidden>
      <button data-outcome="miss">Missed it</button>
      <button data-outcome="hit">Got it</button>
    </div>
    <div id="study-finish" hidden>
      <p id="study-flavour"></p>
      <p id="study-summary"></p>
      <p id="study-sessions"></p>
      <button id="study-done">← decks</button>
    </div>
  </section>
  <section id="deck" hidden>
    <input id="deck-title" aria-label="Deck name">
    <ul id="cards"></ul>
    <button id="add-card">Add card</button>
  </section>
  <script type="module" src="main.js"></script>
</body>
</html>
